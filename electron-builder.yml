appId: com.electron.neon3
productName: Neon Wallet
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  artifactName: NeonWallet-${version}-win.${ext}
  target:
    - target: nsis
      arch:
        - x64
  signtoolOptions:
    publisherName:
    - 'COZ, Inc.'
    sign: './customSign.js'

nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  iconSize: 110
  iconTextSize: 16
  window:
    width: 540
    height: 380
  contents:
    - x: 118
      y: 216
      type: file
    - x: 422
      y: 216
      type: link
      path: /Applications
afterSign: electron-builder-notarize
mac:
  artifactName: NeonWallet-${version}-mac.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  provisioningProfile: build/neon.provisionprofile
  x64ArchFiles: '**/{tiny-secp256k1/build/Release/secp256k1,keccak/prebuilds/darwin-x64/node.napi,electron-webauthn-mac/native/webauthn_mac_addon}.node'
  type: distribution
  target:
    target: default
    arch: universal
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
linux:
  artifactName: NeonWallet-${version}-linux.${ext}
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility

npmRebuild: true
buildDependenciesFromSource: true
publish:
  provider: github
  owner: CityOfZion
  repo: neon-wallet-desktop
